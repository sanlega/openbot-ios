<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7B93FF"/>
      <stop offset="1" stop-color="#4A3FD9"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E7EAFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1B1466" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- iOS: full-bleed square; the system applies the corner mask -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g transform="translate(512 512) scale(1.12) translate(-512 -512)">
  <g filter="url(#shadow)">
    <!-- speech-bubble head -->
    <path d="M330 330 h364 a86 86 0 0 1 86 86 v176 a86 86 0 0 1 -86 86 h-190 l-96 78 v-78 h-78 a86 86 0 0 1 -86 -86 v-176 a86 86 0 0 1 86 -86 z" fill="url(#face)"/>
  </g>
  <!-- antenna -->
  <rect x="496" y="250" width="32" height="80" rx="16" fill="#FFFFFF"/>
  <circle cx="512" cy="238" r="34" fill="#FFFFFF"/>
  <!-- eyes -->
  <rect x="412" y="440" width="58" height="92" rx="29" fill="#3B35C9"/>
  <rect x="554" y="440" width="58" height="92" rx="29" fill="#3B35C9"/>
  </g>
</svg>
