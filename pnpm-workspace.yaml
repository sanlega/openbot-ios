packages:
  - "packages/*"
  # Fakes live one level deeper (e.g. `packages/engines/fake`, `packages/computer/fake`)
  # so their real (WS3/WS9) siblings can land later without moving anything.
  - "packages/*/*"
  - "apps/*"
  - "e2e"

# Native/runtime packages with required setup scripts: better-sqlite3, Electron,
# esbuild's binary download, and react-native-libsodium's packaged native bindings.
onlyBuiltDependencies:
  - better-sqlite3
  - electron
  - esbuild
  - react-native-libsodium
patchedDependencies:
  react-native-libsodium@1.7.0: patches/react-native-libsodium@1.7.0.patch
