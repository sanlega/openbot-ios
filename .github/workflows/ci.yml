name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      # Build before typecheck: `tsc -p ... --noEmit` on a downstream package with
      # TS project `references` needs its upstream packages' `dist/*.d.ts` to
      # already exist (TS6305) on a fresh checkout with no dist/ committed. `pnpm
      # build` runs topologically and emits those first; a bare `pnpm typecheck`
      # on a clean tree fails on any package two or more hops from a leaf.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: mh check
        shell: bash
        run: bash .ai/bin/mh check
