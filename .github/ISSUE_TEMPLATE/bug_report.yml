name: Bug report
description: Report a reproducible problem with OpenBot.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Please remove API keys, tokens, personal information, and private file paths
        from descriptions and logs before submitting.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the steps that reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OpenBot version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Check the content carefully for secrets and private data.
    validations:
      required: false
